name: Daily Admin Password Generator

on:
  schedule:
    # التشغيل تلقائياً يومياً الساعة 12 منتصف الليل بتوقيت UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي للتجربة في أي وقت

jobs:
  generate-password:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js axios

      - name: Run Password Generator Script
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
        run: node daily_password.js
