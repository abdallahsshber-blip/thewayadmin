<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Way — لوحة المشرف</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --ink: #12182B;
            --ink-mute: #4B5566;
            --paper: #EDF0EE;
            --paper-raised: #FFFFFF;
            --teal: #1B6E71;
            --line: #D3D9D5;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Cairo', sans-serif; padding: 24px; }
        .container { max-width: 1200px; margin: 0 auto; }

        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 24, 43, 0.95); display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        .login-box { background: white; padding: 32px; border-radius: 12px; text-align: center; width: 320px; }
        .login-box input { width: 100%; padding: 12px; margin: 16px 0; border: 1px solid var(--line); border-radius: 6px; text-align: center; font-size: 18px; }
        .login-box button { width: 100%; padding: 12px; background: var(--ink); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .badge { background: var(--teal); color: white; padding: 6px 12px; border-radius: 6px; font-size: 14px; }

        .card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 24px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
        th { background: #F8FAFC; font-weight: 700; color: var(--ink-mute); }
        tr:hover { background: #F8FAFC; }
        
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status-pending { background: #FEF3C7; color: #D97706; }

        #map { height: 350px; width: 100%; border-radius: 8px; border: 1px solid var(--line); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h3 style="margin-top:0;">لوحة المشرف</h3>
            <p style="font-size:13px; color:#666;">الصفحة محميّة للمصرح لهم فقط</p>
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <button onclick="checkPass()">دخول</button>
        </div>
    </div>

    <div class="container" id="adminContent" style="display:none;">
        <header>
            <h1>لوحة إدارية — The Way</h1>
            <span class="badge" id="bookingCount">الحجوزات النشطة: 0</span>
        </header>

        <div class="card">
            <h3>جدول الحجوزات المباشرة</h3>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم الطالب</th>
                        <th>الهاتف</th>
                        <th>الانطلاق</th>
                        <th>الوجهة</th>
                        <th>الموعد</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="bookingsTable">
                    <tr><td colspan="7" style="text-align:center;">جاري تحميل البيانات من قاعدة البيانات...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h3>خريطة المسارات ومحطات التجمع</h3>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <script>
        const SUPABASE_URL = "https://cogyqvqpcddamugirkqd.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvZ3lxdnFwY2RkYW11Z2lya3FkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjQ4MzcsImV4cCI6MjEwNTA0MDgzN30.-6vsGlDVPjj1_kUy2IaO5HKrqrcbg7QSFnLKe8jZVjk";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function checkPass() {
            const pass = document.getElementById('passInput').value;
            if (pass === '1234') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                initAdmin();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function initAdmin() {
            const map = L.map('map').setView([30.0131, 31.0003], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            fetchBookings();

            supabaseClient
              .channel('public:bookings')
              .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, payload => {
                  fetchBookings();
              })
              .subscribe();
        }

        async function fetchBookings() {
            const { data: bookings, error } = await supabaseClient
                .from('bookings')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('خطأ في جلب البيانات:', error);
                return;
            }

            const tbody = document.getElementById('bookingsTable');
            document.getElementById('bookingCount').textContent = `الحجوزات النشطة: ${bookings.length}`;

            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">لا توجد حجوزات حالية.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            bookings.forEach((b, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><b>${b.name || '-'}</b></td>
                        <td>${b.phone || '-'}</td>
                        <td>${b.pickup || '-'}</td>
                        <td>${b.dropoff || '-'}</td>
                        <td>${b.time || '-'}</td>
                        <td><span class="status-badge status-pending">قيد الانتظار</span></td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
