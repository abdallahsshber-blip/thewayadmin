<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المشرف — The Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg:#08090C; --s1:#101218; --s2:#181B24; --line:#252A36;
    --tx:#F4F6FA; --ink-mute:#9AA3B5; --blue:#2D7BFF; --blue-d:#1F63DB; --danger:#E5484D;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--tx); font-family:'Readex Pro', sans-serif; line-height:1.7; -webkit-font-smoothing:antialiased;}
  :focus-visible{outline:3px solid var(--blue); outline-offset:2px;}
  .wrap{max-width:1240px; margin:0 auto; padding:24px 28px 60px;}

  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .logo{display:flex; align-items:center; gap:10px; font-size:20px; font-weight:700;}
  .logo i{width:34px; height:34px; border-radius:9px; background:var(--blue); display:grid; place-items:center; font-style:normal; font-size:17px;}
  .badge{font-size:13px; color:var(--ink-mute); background:var(--s1); border:1px solid var(--line); padding:7px 16px; border-radius:999px;}
  .badge strong{color:var(--tx); font-size:15px; margin-inline-start:4px;}

  .lock-screen{
    max-width:380px; margin:120px auto; text-align:center;
    background:var(--s1); border:1px solid var(--line); border-radius:22px; padding:38px 30px;
    box-shadow:0 30px 80px -30px rgba(45,123,255,.35);
  }
  .lock-screen .ic{width:52px; height:52px; border-radius:14px; background:var(--blue); display:grid; place-items:center; margin:0 auto 16px; font-size:24px;}
  .lock-screen h2{font-size:22px; margin:0 0 8px; font-weight:600;}
  .lock-screen p{color:var(--ink-mute); font-size:14px; margin:0 0 20px; font-weight:300;}
  .lock-screen input{
    width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:12px;
    font-size:15px; font-family:inherit; margin-bottom:12px; text-align:center; background:var(--bg); color:#fff;
  }
  .lock-screen input:focus{border-color:var(--blue); outline:0;}
  .lock-screen button{
    width:100%; padding:13px; background:var(--blue); color:#fff; border:none; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s;
  }
  .lock-screen button:hover{background:var(--blue-d);}
  .lock-screen .err{color:#FF7A80; font-size:13px; margin-top:10px; min-height:16px;}

  #dashboard{display:none;}
  #dashboard.show{display:block;}

  .tracking-card{
    background:var(--s1); border:1px solid var(--line); border-radius:18px;
    padding:18px 22px; margin-bottom:20px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    border-inline-start:4px solid var(--blue);
  }
  .tracking-card h3{margin:0; font-size:16px; font-weight:600;}
  .tracking-card p{margin:4px 0 0; font-size:13px; color:var(--ink-mute); font-weight:300;}
  .track-btn{
    padding:11px 22px; background:#2D7BFF; color:#fff; border:none; border-radius:12px;
    font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit; transition:transform .15s;
  }
  .track-btn:hover{transform:translateY(-1px);}

  .layout{display:grid; grid-template-columns:1fr 390px; gap:20px; align-items:start;}
  #adminMap{height:640px; border-radius:18px; border:1px solid var(--line); direction:ltr;}
  .leaflet-container{font-family:'Readex Pro', sans-serif;}
  .popup-name{font-weight:700; font-size:14px; margin-bottom:4px;}
  .popup-row{font-size:12.5px; color:#4B5566; margin-top:2px;}

  .list-panel{
    background:var(--s1); border:1px solid var(--line); border-radius:18px;
    max-height:640px; overflow:hidden; display:flex; flex-direction:column;
  }
  .panel-header{
    padding:15px 20px; background:var(--s2); border-bottom:1px solid var(--line);
    font-weight:600; font-size:14.5px; color:var(--tx);
  }
  .booking-list-container{overflow-y:auto; flex:1;}
  .list-empty{padding:30px 20px; color:var(--ink-mute); font-size:14px; text-align:center;}
  .booking-row{
    padding:15px 20px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .booking-row:hover{background:var(--s2);}
  .booking-row:last-child{border-bottom:none;}
  .booking-row .name{font-weight:600; font-size:14.5px;}
  .booking-row .meta{font-size:12.5px; color:var(--ink-mute); margin-top:4px; line-height:1.7;}
  .booking-row .meta strong{color:var(--tx); font-weight:500;}

  .name-line{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .call-btn{width:32px; height:32px; border-radius:50%; background:rgba(45,123,255,.15); color:#5B9BFF; display:inline-grid; place-items:center; text-decoration:none; flex-shrink:0; transition:background .15s,color .15s;}
  .call-btn:hover,.call-btn:active{background:#2D7BFF; color:#fff;}
  .call-btn svg{width:16px; height:16px; fill:currentColor;}
  .check-btn{
    padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer;
    font-family:inherit; white-space:nowrap; transition:background .15s;
  }
  .check-btn:hover{background:var(--blue-d)!important;}

  .refresh-btn{
    background:var(--blue); color:#fff; border:none; padding:10px 18px; border-radius:12px;
    font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; text-decoration:none; transition:background .15s;
  }
  .refresh-btn:hover{background:var(--blue-d);}
  .refresh-btn.ghost{background:transparent; border:1px solid var(--line); color:var(--tx);}
  .refresh-btn.ghost:hover{border-color:#4A5164;}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    #adminMap{height:420px;}
    .tracking-card{flex-direction:column; text-align:center;}
    .track-btn{width:100%;}
    .wrap{padding:18px 16px 50px;}
  }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="ic">🔒</div>
  <h2>لوحة المشرف</h2>
  <p>الصفحة دي لصاحب المشروع بس. اكتب كلمة المرور للدخول.</p>
  <input type="password" id="pwInput" placeholder="كلمة المرور اليومية">
  <button onclick="checkPassword()">دخول</button>
  <div class="err" id="pwErr"></div>
</div>

<div class="wrap" id="dashboard">
  <header>
    <div class="logo"><i>🚌</i>The Way — لوحة المشرف</div>
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <span class="badge">الحجوزات النشطة <strong id="countBadge">0</strong></span>
      <a id="fullRouteBtn" class="refresh-btn ghost" href="#" target="_blank" rel="noopener">فتح خط السير في خرائط جوجل</a>
      <button class="refresh-btn" onclick="loadBookings()">تحديث</button>
    </div>
  </header>

  <!-- كارت التحكم في بث موقع السائق -->
  <div class="tracking-card">
    <div>
      <h3>تتبع الرحلة المباشر (GPS)</h3>
      <p id="trackingStatus">اضغط على الزر عند بدء الرحلة لمشاركة موقع الأتوبيس اللحظي مع الركاب.</p>
    </div>
    <button id="trackBtn" class="track-btn" onclick="toggleDriverTracking('main_trip')">
      🚀 بدء مشاركة الموقع اللحظي
    </button>
  </div>

  <div class="layout">
    <div id="adminMap"></div>
    <div class="list-panel">
      <div class="panel-header">
        قائمة الحجوزات النشطة
      </div>
      <div class="booking-list-container" id="listPanel">
        <div class="list-empty">جاري التحميل…</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // --- كود حماية اللوحة لمنع أدوات المطورين (F12) والزر الأيمن للماوس ---
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('keydown', (e) => {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // إعدادات اتصال Supabase بالمفتاح العام الصحيح (anon key)
  const SUPABASE_URL = "https://cogyqvqpcddamugirkqd.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvZ3lxdnFwY2RkYW11Z2lya3FkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjQ4MzcsImV4cCI6MjEwNTA0MDgzN30.-6vsGlDVPjj1_kUy2IaO5HKrqrcbg7QSFnLKe8jZVjk";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function checkPassword(){
    const val = document.getElementById('pwInput').value.trim();
    const errDiv = document.getElementById('pwErr');

    if (!val) {
      errDiv.textContent = 'يرجى كتابة كلمة المرور.';
      return;
    }

    errDiv.textContent = 'جاري التحقق…';

    try {
      const { data, error } = await supabaseClient
        .from('daily_passwords')
        .select('*');

      if (error) {
        errDiv.textContent = 'خطأ قاعدة البيانات: ' + error.message;
        return;
      }

      if (!data || data.length === 0) {
        errDiv.textContent = 'جدول كلمات السر فارغ تماماً.';
        return;
      }

      const found = data.find(item => String(item.password) === val);

      if (found) {
        errDiv.textContent = '';
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('dashboard').classList.add('show');
        initMap();
        loadBookings();
        setupFullRouteButton();
        
        supabaseClient
          .channel('public:bookings')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, payload => {
              loadBookings();
          })
          .subscribe();
      } else {
        errDiv.textContent = 'كلمة المرور غير صحيحة.';
      }
    } catch (err) {
      errDiv.textContent = 'خطأ في الاتصال أو لم يتم إنشاء كلمة سر بعد.';
    }
  }

  document.getElementById('pwInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  /* --- كود بث موقع السائق اللحظي عبر GPS الموبايل --- */
  let watchId = null;
  let isTracking = false;

  async function toggleDriverTracking(tripId) {
    const btn = document.getElementById('trackBtn');
    const statusText = document.getElementById('trackingStatus');

    if (!isTracking) {
      if (!('geolocation' in navigator)) {
        alert('خدمة الـ GPS غير مدعومة في هذا المتصفح');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        async (position) => {
          const { latitude: lat, longitude: lng } = position.coords;

          const { error } = await supabaseClient
            .from('driver_locations')
            .upsert(
              { trip_id: tripId, lat: lat, lng: lng, updated_at: new Date() }, 
              { onConflict: 'trip_id' }
            );

          if (error) {
            statusText.innerText = 'خطأ في إرسال الموقع: ' + error.message;
          } else {
            statusText.innerText = `جاري بث الموقع بنجاح... آخر تحديث: ${new Date().toLocaleTimeString('ar-EG')}`;
          }
        },
        (err) => {
          alert('يرجى السماح للمتصفح بالوصول إلى موقع الـ GPS لبدء البث');
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );

      isTracking = true;
      btn.innerText = '🛑 إيقاف مشاركة الموقع';
      btn.style.background = '#E5484D';
    } else {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      isTracking = false;
      btn.innerText = '🚀 بدء مشاركة الموقع اللحظي';
      btn.style.background = '#2D7BFF';
      statusText.innerText = 'تم إيقاف التتبع';
    }
  }

  async function toggleTripCompletion(bookingId) {
    const { error } = await supabaseClient
      .from('bookings')
      .update({ status: 'completed' })
      .eq('id', bookingId);

    if (error) {
      alert('حدث خطأ أثناء تحديث حالة الرحلة: ' + error.message);
    } else {
      loadBookings();
    }
  }

  function googleMapsLink(lat, lng){
    return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  }

  function setupFullRouteButton(){
    const origin = STOPS[0];
    const waypoints = STOPS.slice(1).map(s => `${s.lat},${s.lng}`).join('|');
    const url = `https://www.google.com/maps/dir/?api=1&origin=${origin.lat},${origin.lng}&destination=${DESTINATION.lat},${DESTINATION.lng}&waypoints=${waypoints}&travelmode=driving`;
    document.getElementById('fullRouteBtn').href = url;
  }

  const STOPS = [
    { name: "ميدان النافورة", lat: 30.0153693, lng: 31.2808228 },
    { name: "محطة وقود شل – النخيل", lat: 29.9849727, lng: 31.3568094 },
    { name: "سلم البارون", lat: 29.9825411, lng: 31.3386428 }
  ];
  const DESTINATION = { name: "جامعة النيل", lat: 30.0121847, lng: 30.9868612 };
  let map, markersLayer, routeLatLngs = [];

  function initMap(){
    map = L.map('adminMap').setView([29.999, 31.15], 11);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ'
    }).addTo(map);

    STOPS.forEach(stop => {
      L.marker([stop.lat, stop.lng], {
        icon: L.divIcon({ className:'', html:'<div style="width:14px;height:14px;border-radius:50%;background:#2D7BFF;border:2px solid #08090C;"></div>', iconSize:[14,14] })
      }).addTo(map).bindTooltip(stop.name, { permanent:true, direction:'top', offset:[0,-6] });
    });

    L.marker([DESTINATION.lat, DESTINATION.lng], {
      icon: L.divIcon({ className:'', html:'<div style="width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #2D7BFF;"></div>', iconSize:[16,16] })
    }).addTo(map).bindTooltip('جامعة النيل (الوجهة)', { permanent:true, direction:'top', offset:[0,-6] });

    markersLayer = L.layerGroup().addTo(map);
    map.fitBounds([...STOPS, DESTINATION].map(p => [p.lat, p.lng]), { padding:[40,40] });

    const allPoints = [...STOPS, DESTINATION];
    const coordsParam = allPoints.map(p => `${p.lng},${p.lat}`).join(';');
    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordsParam}?overview=full&geometries=geojson`;
    fetch(osrmUrl)
      .then(r => r.json())
      .then(data => {
        if (data.routes && data.routes[0]) {
          routeLatLngs = data.routes[0].geometry.coordinates.map(c => L.latLng(c[1], c[0]));
          L.polyline(routeLatLngs, { color:'#2D7BFF', weight:4, opacity:0.9 }).addTo(map);
          loadBookings();
        }
      })
      .catch(() => { });
  }

  function getDistanceAlongRoute(lat, lng) {
    if (isNaN(lat) || isNaN(lng) || !routeLatLngs || routeLatLngs.length === 0) {
      return 999999;
    }
    const point = L.latLng(lat, lng);
    let minDistance = Infinity;
    let closestIndex = 0;

    for (let i = 0; i < routeLatLngs.length; i++) {
      const dist = point.distanceTo(routeLatLngs[i]);
      if (dist < minDistance) {
        minDistance = dist;
        closestIndex = i;
      }
    }
    return closestIndex;
  }

  async function loadBookings(){
    document.getElementById('listPanel').innerHTML = '<div class="list-empty">جاري التحميل…</div>';

    // جلب الرحلات التي لم تنتهِ فقط
    const { data, error } = await supabaseClient
      .from('bookings')
      .select('*')
      .neq('status', 'completed');

    if (error) {
      console.error('خطأ في جلب الحجوزات:', error);
      document.getElementById('listPanel').innerHTML = '<div class="list-empty">حدث خطأ أثناء جلب الحجوزات من قاعدة البيانات.</div>';
      return;
    }

    renderBookings(data || []);
  }

  function renderBookings(data){
    markersLayer.clearLayers();
    const listPanel = document.getElementById('listPanel');
    document.getElementById('countBadge').textContent = data.length;

    if (!data.length){
      listPanel.innerHTML = `<div class="list-empty">لا توجد حجوزات نشطة حالياً.</div>`;
      return;
    }

    // ترتيب أمني حقيقي لمنع تجمد الواجهة في حال غياب Lat/Lng
    data.sort((a, b) => {
      const posA = getDistanceAlongRoute(parseFloat(a.lat), parseFloat(a.lng));
      const posB = getDistanceAlongRoute(parseFloat(b.lat), parseFloat(b.lng));
      return posA - posB;
    });

    listPanel.innerHTML = '';
    const bounds = [];

    data.forEach((b) => {
      const lat = parseFloat(b.lat), lng = parseFloat(b.lng);
      const hasCoords = !isNaN(lat) && !isNaN(lng);

      if (hasCoords){
        const marker = L.marker([lat, lng], {
          icon: L.divIcon({ 
            className:'', 
            html:`<div style="width:16px;height:16px;border-radius:50%;background:#08090C;border:2px solid #fff;box-shadow:0 0 0 2px #2D7BFF;"></div>`, 
            iconSize:[16,16] 
          })
        });
        marker.bindPopup(
          `<div class="popup-name">${escapeHtml(b.name)}</div>
           <div class="popup-row">الهاتف: ${escapeHtml(b.phone)}</div>
           <div class="popup-row">الصعود: ${escapeHtml(b.pickup)}</div>
           <div class="popup-row">الوجهة: ${escapeHtml(b.dropoff)} · الموعد: ${escapeHtml(b.time)}</div>
           <a href="${googleMapsLink(lat, lng)}" target="_blank" rel="noopener" style="display:inline-block; margin-top:8px; font-size:12.5px; font-weight:700; color:#1F63DB;">فتح في خرائط جوجل ←</a>`
        );
        marker.addTo(markersLayer);
        bounds.push([lat, lng]);
      }

      const row = document.createElement('div');
      row.className = 'booking-row';

      row.innerHTML = `
        <div>
          <div class="name name-line">${escapeHtml(b.name)} ${callButton(b.phone)} <span style="font-weight:400; color:var(--ink-mute); font-size:12px;">${escapeHtml(b.phone)}</span></div>
          <div class="meta">
            📍 <strong>${escapeHtml(b.pickup)}</strong> ← ${escapeHtml(b.dropoff)}<br>
            ⏰ الموعد: ${escapeHtml(b.time)}
          </div>
          ${hasCoords ? `<a href="${googleMapsLink(lat, lng)}" target="_blank" rel="noopener" style="display:inline-block; margin-top:6px; font-size:12px; font-weight:600; color:#5B9BFF; text-decoration:none;" onclick="event.stopPropagation();">فتح في خرائط جوجل ←</a>` : ''}
        </div>
        <div>
          <button class="check-btn" 
                  onclick="event.stopPropagation(); toggleTripCompletion(${b.id})" 
                  style="border: 1px solid #2D7BFF; background: #2D7BFF; color: #fff;">
            ✅ تم الالتقاط
          </button>
        </div>
      `;

      if (hasCoords){
        row.addEventListener('click', () => map.setView([lat, lng], 15));
      }
      listPanel.appendChild(row);
    });

    if (bounds.length){
      bounds.push([DESTINATION.lat, DESTINATION.lng]);
      map.fitBounds(bounds, { padding:[30,30] });
    }
  }

  const PHONE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>';
  function callButton(phone){
    const num = String(phone || '').replace(/[^\d+]/g, '');
    if (!num) return '';
    return `<a class="call-btn" href="tel:${num}" aria-label="اتصل بالعميل" title="اتصل بالعميل" onclick="event.stopPropagation();">${PHONE_SVG}</a>`;
  }

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>
</body>
</html>
