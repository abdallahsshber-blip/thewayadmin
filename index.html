<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المشرف — The Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --ink:#12182B; --ink-mute:#4B5566;
    --paper:#EDF0EE; --paper-raised:#FFFFFF;
    --amber:#F2A900; --teal:#1B6E71; --line:#D3D9D5;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Cairo', sans-serif;}
  .wrap{max-width:1160px; margin:0 auto; padding:28px 32px 60px;}

  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .logo{display:flex; align-items:center; gap:9px; font-size:22px; font-weight:800;}
  .logo .dot{width:9px; height:9px; border-radius:2px; background:var(--teal); display:inline-block;}
  .badge{font-size:13px; color:var(--ink-mute); background:var(--paper-raised); border:1px solid var(--line); padding:7px 14px; border-radius:5px;}
  .badge strong{color:var(--ink);}

  .lock-screen{
    max-width:360px; margin:120px auto; text-align:center;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:6px; padding:36px 28px;
  }
  .lock-screen h2{font-size:22px; margin:0 0 8px;}
  .lock-screen p{color:var(--ink-mute); font-size:14px; margin:0 0 18px;}
  .lock-screen input{
    width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:5px;
    font-size:15px; font-family:inherit; margin-bottom:12px; text-align:center;
  }
  .lock-screen button{
    width:100%; padding:12px; background:var(--ink); color:#fff; border:none; border-radius:5px;
    font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .lock-screen .err{color:#B3402A; font-size:13px; margin-top:10px; min-height:16px;}

  #dashboard{display:none;}
  #dashboard.show{display:block;}

  /* كارت التتبع المباشر للسائق */
  .tracking-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .tracking-card h3 { margin: 0; font-size: 16px; }
  .tracking-card p { margin: 4px 0 0; font-size: 13px; color: var(--ink-mute); }
  .track-btn {
    padding: 10px 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background .2s;
  }

  .layout{display:grid; grid-template-columns:1fr 380px; gap:20px; align-items:start;}
  #adminMap{
    height:620px; border-radius:6px; border:1px solid var(--line); direction:ltr;
  }
  .leaflet-container{font-family:'Cairo', sans-serif;}
  .popup-name{font-weight:700; font-size:14px; margin-bottom:4px;}
  .popup-row{font-size:12.5px; color:#4B5566; margin-top:2px;}

  .list-panel{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:6px;
    max-height:620px; overflow-y:auto; display:flex; flex-direction:column;
  }

  /* أزرار التبويب لتصفية الحجوزات */
  .tab-bar {
    display: flex;
    border-bottom: 1px solid var(--line);
    background: #f8f9fa;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 12px 10px;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-mute);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all .15s ease;
  }
  .tab-btn.active {
    color: var(--teal);
    border-bottom-color: var(--teal);
    background: var(--paper-raised);
  }

  .booking-list-container {
    overflow-y: auto;
    flex: 1;
  }

  .list-empty{padding:28px 20px; color:var(--ink-mute); font-size:14px; text-align:center;}
  .booking-row{
    padding:14px 18px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s, opacity .2s;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .booking-row:hover{background:#F6F5F1;}
  .booking-row:last-child{border-bottom:none;}
  .booking-row .name{font-weight:700; font-size:14.5px;}
  .booking-row .meta{font-size:12.5px; color:var(--ink-mute); margin-top:4px; line-height:1.6;}

  .check-btn {
    padding: 6px 12px;
    border-radius: 5px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all .15s ease;
  }

  .refresh-btn{
    background:var(--teal); color:#fff; border:none; padding:9px 16px; border-radius:5px;
    font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .refresh-btn:hover{background:#155457;}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    #adminMap{height:400px;}
    .tracking-card { flex-direction: column; text-align: center; }
    .track-btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <h2>لوحة المشرف</h2>
  <p>الصفحة دي لصاحب المشروع بس. اكتب كلمة المرور للدخول.</p>
  <input type="password" id="pwInput" placeholder="كلمة المرور اليومية">
  <button onclick="checkPassword()">دخول</button>
  <div class="err" id="pwErr"></div>
</div>

<div class="wrap" id="dashboard">
  <header>
    <div class="logo"><span class="dot"></span>The Way — لوحة المشرف</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="badge">عدد الحجوزات: <strong id="countBadge">0</strong></span>
      <a id="fullRouteBtn" class="refresh-btn" style="text-decoration:none; background:var(--ink);" href="#" target="_blank" rel="noopener">فتح خط السير في خرائط جوجل</a>
      <button class="refresh-btn" onclick="loadBookings()">تحديث</button>
    </div>
  </header>

  <!-- كارت التحكم في بث موقع السائق -->
  <div class="tracking-card">
    <div>
      <h3>تتبع الرحلة المباشر (GPS)</h3>
      <p id="trackingStatus">اضغط على الزر عند بدء الرحلة لمشاركة موقع الأتوبيس اللحظي مع الركاب.</p>
    </div>
    <button id="trackBtn" class="track-btn" onclick="toggleDriverTracking('main_trip')">
      🚀 بدء مشاركة الموقع اللحظي
    </button>
  </div>

  <div class="layout">
    <div id="adminMap"></div>
    <div class="list-panel">
      <!-- أزرار التبويب لتصفية القائمة -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tabActiveBtn" onclick="switchTab('active')">الرحلة الحالية</button>
        <button class="tab-btn" id="tabCompletedBtn" onclick="switchTab('completed')">الأرشيف والمنتهية</button>
      </div>
      <div class="booking-list-container" id="listPanel">
        <div class="list-empty">جاري التحميل…</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // إعدادات اتصال Supabase
  const SUPABASE_URL = "https://cogyqvqpcddamugirkqd.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvZ3lxdnFwY2RkYW11Z2lya3FkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjQ4MzcsImV4cCI6MjEwNTA0MDgzN30.-6vsGlDVPjj1_kUy2IaO5HKrqrcbg7QSFnLKe8jZVjk";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentTab = 'active'; // الحالة الافتراضية: الرحلات الحالية فقط

  async function checkPassword(){
    const val = document.getElementById('pwInput').value.trim();
    const errDiv = document.getElementById('pwErr');

    if (!val) {
      errDiv.textContent = 'يرجى كتابة كلمة المرور.';
      return;
    }

    errDiv.textContent = 'جاري التحقق…';

    const today = new Date().toLocaleDateString('en-CA'); 

    const { data, error } = await supabaseClient
      .from('daily_passwords')
      .select('password')
      .eq('date', today)
      .maybeSingle();

    if (error || !data) {
      errDiv.textContent = 'لم يتم إنشاء كلمة سر لليوم بعد.';
      return;
    }

    if (val === data.password){
      errDiv.textContent = '';
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('dashboard').classList.add('show');
      initMap();
      loadBookings();
      setupFullRouteButton();
      
      supabaseClient
        .channel('public:bookings')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, payload => {
            loadBookings();
        })
        .subscribe();
    } else {
      errDiv.textContent = 'كلمة المرور اليومية غير صحيحة.';
    }
  }

  document.getElementById('pwInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  /* --- كود بث موقع السائق اللحظي عبر GPS الموبايل --- */
  let watchId = null;
  let isTracking = false;

  async function toggleDriverTracking(tripId) {
    const btn = document.getElementById('trackBtn');
    const statusText = document.getElementById('trackingStatus');

    if (!isTracking) {
      if (!('geolocation' in navigator)) {
        alert('خدمة الـ GPS غير مدعومة في هذا المتصفح');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        async (position) => {
          const { latitude: lat, longitude: lng } = position.coords;

          const { error } = await supabaseClient
            .from('driver_locations')
            .upsert(
              { trip_id: tripId, lat: lat, lng: lng, updated_at: new Date() }, 
              { onConflict: 'trip_id' }
            );

          if (error) {
            statusText.innerText = 'خطأ في إرسال الموقع: ' + error.message;
          } else {
            statusText.innerText = `جاري بث الموقع بنجاح... آخر تحديث: ${new Date().toLocaleTimeString('ar-EG')}`;
          }
        },
        (err) => {
          alert('يرجى السماح للمتصفح بالوصول إلى موقع الـ GPS لبدء البث');
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );

      isTracking = true;
      btn.innerText = '🛑 إيقاف مشاركة الموقع';
      btn.style.background = '#dc3545';
    } else {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      isTracking = false;
      btn.innerText = '🚀 بدء مشاركة الموقع اللحظي';
      btn.style.background = '#28a745';
      statusText.innerText = 'تم إيقاف التتبع';
    }
  }

  // التبديل بين التبويبات (الرحلة الحالية / الأرشيف)
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabActiveBtn').classList.toggle('active', tab === 'active');
    document.getElementById('tabCompletedBtn').classList.toggle('active', tab === 'completed');
    loadBookings();
  }

  // تغيير حالة الرحلة (من نشطة إلى منتهية أو العكس)
  async function toggleTripCompletion(bookingId, isCurrentlyCompleted) {
    const newStatus = isCurrentlyCompleted ? 'active' : 'completed';
    
    const { error } = await supabaseClient
      .from('bookings')
      .update({ status: newStatus })
      .eq('id', bookingId);

    if (error) {
      alert('حدث خطأ أثناء تحديث حالة الرحلة: ' + error.message);
    } else {
      loadBookings();
    }
  }

  function googleMapsLink(lat, lng){
    return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  }

  function setupFullRouteButton(){
    const origin = STOPS[0];
    const waypoints = STOPS.slice(1).map(s => `${s.lat},${s.lng}`).join('|');
    const url = `https://www.google.com/maps/dir/?api=1&origin=${origin.lat},${origin.lng}&destination=${DESTINATION.lat},${DESTINATION.lng}&waypoints=${waypoints}&travelmode=driving`;
    document.getElementById('fullRouteBtn').href = url;
  }

  const STOPS = [
    { name: "ميدان النافورة", lat: 30.0153693, lng: 31.2808228 },
    { name: "محطة وقود شل – النخيل", lat: 29.9849727, lng: 31.3568094 },
    { name: "سلم البارون", lat: 29.9825411, lng: 31.3386428 }
  ];
  const DESTINATION = { name: "جامعة النيل", lat: 30.0121847, lng: 30.9868612 };
  let map, markersLayer, routeLatLngs = [];

  function initMap(){
    map = L.map('adminMap').setView([29.999, 31.15], 11);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ'
    }).addTo(map);

    STOPS.forEach(stop => {
      L.marker([stop.lat, stop.lng], {
        icon: L.divIcon({ className:'', html:'<div style="width:14px;height:14px;border-radius:50%;background:#F2A900;border:2px solid #0B1020;"></div>', iconSize:[14,14] })
      }).addTo(map).bindTooltip(stop.name, { permanent:true, direction:'top', offset:[0,-6] });
    });

    L.marker([DESTINATION.lat, DESTINATION.lng], {
      icon: L.divIcon({ className:'', html:'<div style="width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #F2A900;"></div>', iconSize:[16,16] })
    }).addTo(map).bindTooltip('جامعة النيل (الوجهة)', { permanent:true, direction:'top', offset:[0,-6] });

    markersLayer = L.layerGroup().addTo(map);
    map.fitBounds([...STOPS, DESTINATION].map(p => [p.lat, p.lng]), { padding:[40,40] });

    const allPoints = [...STOPS, DESTINATION];
    const coordsParam = allPoints.map(p => `${p.lng},${p.lat}`).join(';');
    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordsParam}?overview=full&geometries=geojson`;
    fetch(osrmUrl)
      .then(r => r.json())
      .then(data => {
        if (data.routes && data.routes[0]) {
          routeLatLngs = data.routes[0].geometry.coordinates.map(c => L.latLng(c[1], c[0]));
          L.polyline(routeLatLngs, { color:'#1B6E71', weight:4, opacity:0.9 }).addTo(map);
          loadBookings();
        }
      })
      .catch(() => { });
  }

  function getDistanceAlongRoute(lat, lng) {
    if (isNaN(lat) || isNaN(lng) || !routeLatLngs || routeLatLngs.length === 0) {
      return 999999;
    }
    const point = L.latLng(lat, lng);
    let minDistance = Infinity;
    let closestIndex = 0;

    for (let i = 0; i < routeLatLngs.length; i++) {
      const dist = point.distanceTo(routeLatLngs[i]);
      if (dist < minDistance) {
        minDistance = dist;
        closestIndex = i;
      }
    }
    return closestIndex;
  }

  async function loadBookings(){
    document.getElementById('listPanel').innerHTML = '<div class="list-empty">جاري التحميل…</div>';

    // جلب الحجوزات المفلترة بحسب الحالة المحددة (active أو completed)
    let query = supabaseClient.from('bookings').select('*');
    
    if (currentTab === 'completed') {
      query = query.eq('status', 'completed');
    } else {
      // إظهار الحجوزات النشطة (سواء status = active أو التي لا تحتوى على status بعد)
      query = query.or('status.eq.active,status.is.null');
    }

    const { data, error } = await query;

    if (error) {
      console.error('خطأ في جلب الحجوزات:', error);
      document.getElementById('listPanel').innerHTML = '<div class="list-empty">حدث خطأ أثناء جلب الحجوزات من قاعدة البيانات.</div>';
      return;
    }

    renderBookings(data || []);
  }

  function renderBookings(data){
    markersLayer.clearLayers();
    const listPanel = document.getElementById('listPanel');
    document.getElementById('countBadge').textContent = data.length;

    if (!data.length){
      listPanel.innerHTML = `<div class="list-empty">${currentTab === 'completed' ? 'لا توجد رحلات منتهية بالأرشيف.' : 'لا توجد حجوزات حقيقية حالياً.'}</div>`;
      return;
    }

    data.sort((a, b) => {
      const posA = getDistanceAlongRoute(parseFloat(a.lat), parseFloat(a.lng));
      const posB = getDistanceAlongRoute(parseFloat(b.lat), parseFloat(b.lng));
      return posA - posB;
    });

    listPanel.innerHTML = '';
    const bounds = [];

    data.forEach((b) => {
      const lat = parseFloat(b.lat), lng = parseFloat(b.lng);
      const hasCoords = !isNaN(lat) && !isNaN(lng);
      const isCompleted = b.status === 'completed';

      // عرض العلامات على الخريطة فقط للرحلات الحالية
      if (hasCoords && !isCompleted){
        const marker = L.marker([lat, lng], {
          icon: L.divIcon({ 
            className:'', 
            html:`<div style="width:16px;height:16px;border-radius:50%;background:#12182B;border:2px solid #fff;box-shadow:0 0 0 2px #12182B;"></div>`, 
            iconSize:[16,16] 
          })
        });
        marker.bindPopup(
          `<div class="popup-name">${escapeHtml(b.name)}</div>
           <div class="popup-row">الهاتف: ${escapeHtml(b.phone)}</div>
           <div class="popup-row">الصعود: ${escapeHtml(b.pickup)}</div>
           <div class="popup-row">الوجهة: ${escapeHtml(b.dropoff)} · الموعد: ${escapeHtml(b.time)}</div>
           <a href="${googleMapsLink(lat, lng)}" target="_blank" rel="noopener" style="display:inline-block; margin-top:8px; font-size:12.5px; font-weight:700; color:#1B6E71;">فتح في خرائط جوجل ←</a>`
        );
        marker.addTo(markersLayer);
        bounds.push([lat, lng]);
      }

      const row = document.createElement('div');
      row.className = 'booking-row';

      row.innerHTML = `
        <div>
          <div class="name">${escapeHtml(b.name)} <span style="font-weight:400; color:var(--ink-mute); font-size:12px;">· ${escapeHtml(b.phone)}</span></div>
          <div class="meta">
            📍 <strong>${escapeHtml(b.pickup)}</strong> ← ${escapeHtml(b.dropoff)}<br>
            ⏰ الموعد: ${escapeHtml(b.time)}
          </div>
          ${hasCoords ? `<a href="${googleMapsLink(lat, lng)}" target="_blank" rel="noopener" style="display:inline-block; margin-top:6px; font-size:12px; font-weight:700; color:#1B6E71; text-decoration:none;" onclick="event.stopPropagation();">فتح في خرائط جوجل ←</a>` : ''}
        </div>
        <div>
          <button class="check-btn" 
                  onclick="event.stopPropagation(); toggleTripCompletion(${b.id}, ${isCompleted})" 
                  style="border: 1px solid ${isCompleted ? '#6c757d' : '#28a745'}; background: ${isCompleted ? '#f8f9fa' : '#28a745'}; color: ${isCompleted ? '#333' : '#fff'};">
            ${isCompleted ? 'إعادة للنشطة ↺' : '✅ إنهاء الرحلة'}
          </button>
        </div>
      `;

      if (hasCoords){
        row.addEventListener('click', () => map.setView([lat, lng], 15));
      }
      listPanel.appendChild(row);
    });

    if (bounds.length && currentTab === 'active'){
      bounds.push([DESTINATION.lat, DESTINATION.lng]);
      map.fitBounds(bounds, { padding:[30,30] });
    }
  }

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>
</body>
</html>
